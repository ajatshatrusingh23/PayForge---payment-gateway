name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · typecheck, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx jest --ci --coverage
      - run: npm run build

  web:
    name: Web · SDK, checkout, dashboard builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: SDK
        working-directory: sdk/payforge-js
        run: npm ci && npm run build
      - name: Hosted checkout
        working-directory: web/checkout
        run: npm ci && npm run build
      - name: Dashboard
        working-directory: web/dashboard
        run: npm ci && npx tsc --noEmit && npx next build

  e2e:
    name: End-to-end · full stack against real Postgres, Redis and Kafka
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payforge
          POSTGRES_PASSWORD: payforge
          POSTGRES_DB: payforge
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U payforge" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start Redpanda (Kafka API)
        run: |
          docker run -d --name redpanda -p 19092:19092 docker.redpanda.com/redpandadata/redpanda:v24.2.7 \
            redpanda start --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
            --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092 \
            --smp 1 --memory 512M --overprovisioned --mode dev-container
          for _ in $(seq 1 30); do docker exec redpanda rpk cluster health | grep -q 'Healthy:.*true' && break; sleep 2; done
      - name: Build backend
        working-directory: backend
        run: npm ci && npm run build
      - name: Start services
        working-directory: backend
        run: |
          nohup node scripts/start-all.mjs > services.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf localhost:8080/health && curl -sf localhost:4002/health && break; sleep 2; done
          sleep 5
      - name: Run end-to-end suite
        run: node scripts/e2e.mjs
      - name: Short load test
        run: node scripts/loadtest.mjs --duration 15 --concurrency 20
      - name: Service logs
        if: always()
        run: tail -n 300 backend/services.log
